[project]
name = "mcp-monte-carlo"
version = "0.1.0"
description = "MCP server for EGARCH + skewed-t Monte Carlo asset forecasts"
readme = "README.md"
authors = [
    { name = "Alexandre Martins", email = "martins.gomes.alex@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arch>=7.0.0",
    "mcp[cli]>=2,<3",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "yfinance>=0.2.40",
]

[project.scripts]
mcp-monte-carlo = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
